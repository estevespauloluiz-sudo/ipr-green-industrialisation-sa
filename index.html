const ABBR_KEYS = Object.keys(ABBR).sort((a,b)=>b.length-a.length);
const ABBR_RE = new RegExp('(?<![\\w&])(' + ABBR_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\\\]/g,'\\$&')).join('|') + ')(?![\\w&])','g');

const T = ({c}) => ABBR[c] ? <span data-tip={ABBR[c]}>{c}</span> : <span>{c}</span>;
const TipText = ({children}) => {
  if (typeof children !== "string") return children;
  const parts = []; let last = 0; let m;
  ABBR_RE.lastIndex = 0;
  while ((m = ABBR_RE.exec(children)) !== null) {
    if (m.index > last) parts.push(children.slice(last, m.index));
    parts.push(<span key={parts.length} data-tip={ABBR[m[1]]}>{m[1]}</span>);
    last = m.index + m[1].length;
  }
  if (last < children.length) parts.push(children.slice(last));
  return <>{parts}</>;
};

// ─── IP COMMERCIALISATION TAB (v5) ─────────────────────────────────
const IPCommercialisationTab = ({country, filter, setFilter, view, setView, setTab, setSectorIdOverride}) => {
  const D_ = COUNTRY_DATA[country];
  const T_ = COUNTRY_THEMES[country];
  const IPC = D_.ipcomm;
  // view + setView come from Dashboard (lifted state); fallback to local for safety.
  const [localView, setLocalView] = useState("modality");
  const v = view || localView;
  const setV = setView || setLocalView;
  // Sector pill click handler (reverse nav: modality → value chains).
  const sectorPillClick = (sectorId) => {
    if (!setSectorIdOverride || !setTab) return;
    if (!sectorId || sectorId==="cross") return; // cross-cutting has no chain target
    setSectorIdOverride(sectorId);
    setTab("chains");
  };
  // Filter helpers ---------------------------------------------------
  const fltSectorId = filter?.sectorId || null;
  const fltSectorName = filter?.sectorName || null;
  const fltTech = filter?.techName || null;
  // Normalise tech filter to lowercase tokens for matching.
  const techHaystack = (fltTech || "").toLowerCase();
  const techMatches = (entry) => {
    if (!fltTech) return false;
    const t = (entry.techTags || []).map(x=>x.toLowerCase());
    // Match if any techTag is contained in clicked tech name, OR clicked tech name contains the tag.
    return t.some(tag => techHaystack.includes(tag) || tag.includes(techHaystack));
  };
  const passesFilter = (entry) => {
    if (!fltSectorId) return true;
    // Sector-cross entries surface for any sector filter (they apply broadly).
    if (entry.sectorId === "cross") return true;
    return entry.sectorId === fltSectorId;
  };
  // For the displayed entries: first apply filter, then sort with tech-matching first.
  const visibleModality = IPC.modality
    .filter(passesFilter)
    .map(e=>({...e, _techHit: techMatches(e)}))
    .sort((a,b)=>(b._techHit?1:0)-(a._techHit?1:0));

  // Modality category colour map
  const modColour = (kind) => {
    if (kind.startsWith("Licensing")) return "#2563EB";
    if (kind.startsWith("Cross-licensing")) return "#7C3AED";
    if (kind.startsWith("Joint venture")) return "#0891B2";
    if (kind.startsWith("FDI")) return "#0D9488";
    if (kind.startsWith("Bilateral MoU")) return "#0EA5E9";
    if (kind.startsWith("Compulsory")) return "#DC2626";
    if (kind.startsWith("Open pledge")) return "#16A34A";
    if (kind.startsWith("Patent pool")) return "#F59E0B";
    if (kind.startsWith("Technology transfer")) return "#9333EA";
    if (kind.startsWith("Patent sale")) return "#EA580C";
    return "#6B7280";
  };

  // Pipeline kind colour map
  const pipeColour = (kind) => {
    if (kind.startsWith("Multilateral")) return "#7C3AED";
    if (kind.startsWith("National TTO")) return "#0891B2";
    if (kind.startsWith("University TTO")) return "#0D9488";
    if (kind.startsWith("DFI")) return "#F59E0B";
    if (kind.startsWith("Sectoral accelerator")) return "#16A34A";
    if (kind.startsWith("Patent pool")) return "#EA580C";
    if (kind.startsWith("Standards body")) return "#4338CA";
    return "#6B7280";
  };

  return (
    <div style={{maxWidth:1200, margin:"0 auto", padding:"16px"}}>

      {/* Header / intro */}
      <div style={{background:"#fff", borderRadius:12, border:"1px solid #E5E7EB", padding:"20px 24px", marginBottom:16, borderTop:"4px solid "+T_.header}}>
        <h2 style={{fontSize:22, fontWeight:700, color:"#111827", margin:"0 0 6px"}}>{T_.flag} {T_.name} — <T c="IP"/> Commercialisation</h2>
        <p style={{fontSize:13, color:"#4B5563", lineHeight:1.65, margin:"0 0 8px"}}>
          The bridge between the <T c="IP"/> regime as institutional structure and the actual flows of green technology into the country. <strong>Modality</strong> tracks how <T c="IP"/> is being made available — licensing, JVs, FDI, cross-licensing, patent pools, open pledges, compulsory licensing, multilateral technology transfer. <strong>Pipeline</strong> maps the upstream marketplace — multilateral platforms, national tech-transfer offices, university TTOs, DFI-linked vehicles, sectoral accelerators, standards bodies.
        </p>
        <p style={{fontSize:12, color:"#6B7280", lineHeight:1.65, margin:0, fontStyle:"italic"}}>
          Alpha v5 layer. Where terms are confidential, the cell is flagged 'undisclosed' or 'indirect'. The absence is itself analytical content.
        </p>
      </div>

      {/* Sub-view toggle */}
      <div style={{display:"flex", gap:8, marginBottom:14, alignItems:"center", flexWrap:"wrap"}}>
        <span style={{fontSize:11, fontWeight:700, color:"#6B7280", textTransform:"uppercase", letterSpacing:1.5, marginRight:4}}>View</span>
        {[
          {k:"modality", label:"Modality  —  how IP is being made available"},
          {k:"pipeline", label:"Pipeline  —  upstream marketplace and tech-transfer infrastructure"}
        ].map(opt => (
          <button key={opt.k} onClick={()=>setV(opt.k)}
            style={{
              padding:"10px 18px", borderRadius:8, border:"1px solid "+(v===opt.k ? T_.header : "#D1D5DB"),
              background: v===opt.k ? T_.header : "#fff",
              color: v===opt.k ? "#fff" : "#374151",
              fontSize:12.5, fontWeight:600, cursor:"pointer", transition:"all .15s"
            }}>{opt.label}</button>
        ))}
      </div>

      {/* Filter chip — visible when arriving from Value Chains */}
      {(fltSectorId || fltTech) && v==="modality" && (
        <div style={{background:"#EFF6FF", border:"1px solid #BFDBFE", borderRadius:10, padding:"12px 16px", marginBottom:14, display:"flex", flexWrap:"wrap", alignItems:"center", gap:10, justifyContent:"space-between"}}>
          <div style={{display:"flex", flexWrap:"wrap", alignItems:"center", gap:10}}>
            <span style={{fontSize:10.5, fontWeight:700, color:"#1E3A8A", textTransform:"uppercase", letterSpacing:1.2}}>Filtered from Value Chains</span>
            {fltSectorName && <span style={{fontSize:12, color:"#1E40AF", background:"#fff", padding:"4px 10px", borderRadius:99, border:"1px solid #BFDBFE", fontWeight:600}}>Sector: {fltSectorName}</span>}
            {fltTech && <span style={{fontSize:12, color:"#1E40AF", background:"#fff", padding:"4px 10px", borderRadius:99, border:"1px solid #BFDBFE", fontWeight:600}}>Technology: {fltTech}</span>}
            <span style={{fontSize:11, color:"#1E40AF", fontStyle:"italic"}}>
              Cross-cutting entries (e.g., compulsory licensing) surface alongside sector-specific ones. {fltTech && "Entries tagged with this technology are highlighted and shown first."}
            </span>
          </div>
          <button onClick={()=>setFilter && setFilter(null)}
            style={{padding:"6px 12px", border:"1px solid #1E40AF", background:"#fff", color:"#1E40AF", borderRadius:6, fontSize:11.5, fontWeight:700, cursor:"pointer"}}>
            × Clear filter
          </button>
        </div>
      )}

      {/* ─── MODALITY VIEW ─── */}
      {v==="modality" && (
        <div>
          {/* Modality legend */}
          <div style={{background:"#F9FAFB", border:"1px solid #E5E7EB", borderRadius:10, padding:"10px 14px", marginBottom:14, display:"flex", flexWrap:"wrap", gap:8, alignItems:"center"}}>
            <span style={{fontSize:10.5, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:1, marginRight:6}}>Modality taxonomy</span>
            {[
              "Licensing — bilateral","Cross-licensing","Joint venture with know-how","FDI with embedded production","Bilateral MoU","Patent pool membership","Open pledge / open-source","Compulsory licensing","Technology transfer agreement","Patent sale / acquisition"
            ].map(k=>(
              <span key={k} style={{fontSize:10, color:"#fff", background:modColour(k), padding:"2px 8px", borderRadius:99, fontWeight:600}}>{k}</span>
            ))}
          </div>

          {/* Empty state if filter narrows to zero sector matches */}
          {visibleModality.length === 0 && (
            <div style={{background:"#FFFBEB", border:"1px solid #FDE68A", borderRadius:10, padding:"16px 18px", marginBottom:12}}>
              <div style={{fontSize:12.5, fontWeight:700, color:"#92400E", marginBottom:4}}>No modality entries catalogued for this sector in the alpha dataset.</div>
              <div style={{fontSize:12, color:"#78350F", lineHeight:1.6}}>
                The absence is itself analytical content: either the modalities operative in this sector are not yet visible in the public domain, or the dashboard's coverage of this sector needs to be expanded in the next iteration. The methodological note at the bottom of the tab elaborates.
              </div>
            </div>
          )}

          {/* Modality cards */}
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(360px,1fr))", gap:12}}>
            {visibleModality.map((m,i)=>{
              const hit = m._techHit;
              const reverseClickable = m.sectorId && m.sectorId !== "cross" && setSectorIdOverride && setTab;
              return (
                <div key={i} className="ph-card" style={{background:"#fff", border:hit?"2px solid "+T_.header:"1px solid #E5E7EB", borderRadius:10, padding:"14px 16px", display:"flex", flexDirection:"column", gap:6, borderLeft:"4px solid "+modColour(m.kind), boxShadow:hit?"0 4px 12px rgba(0,0,0,0.08)":"none"}}>
                  {hit && (
                    <div style={{fontSize:10, fontWeight:700, color:"#fff", background:T_.header, padding:"3px 8px", borderRadius:4, alignSelf:"flex-start", letterSpacing:0.4, textTransform:"uppercase"}}>★ Matches technology: {fltTech}</div>
                  )}
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, flexWrap:"wrap"}}>
                    <span style={{fontSize:10.5, fontWeight:700, color:"#fff", background:modColour(m.kind), padding:"2px 8px", borderRadius:99}}>{m.kind}</span>
                    {reverseClickable ? (
                      <button onClick={()=>sectorPillClick(m.sectorId)} title={`Open ${m.sector} in Value Chains`}
                        style={{fontSize:10, fontWeight:600, color:"#1E40AF", letterSpacing:0.5, textTransform:"uppercase", background:"#EFF6FF", border:"1px solid #BFDBFE", padding:"2px 8px", borderRadius:99, cursor:"pointer"}}>
                        {m.sector} ↗
                      </button>
                    ) : (
                      <span style={{fontSize:10, fontWeight:600, color:"#6B7280", letterSpacing:0.5, textTransform:"uppercase"}}>{m.sector}</span>
                    )}
                  </div>
                  <div style={{fontSize:13.5, fontWeight:700, color:"#111827", lineHeight:1.4, marginTop:4}}>{m.actors}</div>
                  <div style={{fontSize:12, color:"#374151", lineHeight:1.55}}><span style={{fontWeight:600, color:"#6B7280"}}>Scope:</span> {m.scope}</div>
                  <div style={{fontSize:12, color:"#374151", lineHeight:1.55}}><span style={{fontWeight:600, color:"#6B7280"}}>Terms:</span> <em>{m.terms}</em></div>
                  <div style={{fontSize:11, color:"#6B7280", lineHeight:1.55}}><span style={{fontWeight:600}}>Visibility:</span> {m.visibility}</div>
                  {m.techTags && m.techTags.length > 0 && (
                    <div style={{display:"flex", flexWrap:"wrap", gap:4, marginTop:2}}>
                      {m.techTags.slice(0,6).map((t,k)=>(
                        <span key={k} style={{fontSize:9.5, color:"#4B5563", background:"#F3F4F6", padding:"2px 7px", borderRadius:4, border:"1px solid #E5E7EB"}}>{t}</span>
                      ))}
                    </div>
                  )}
                  <div style={{fontSize:11.5, color:"#4B5563", lineHeight:1.6, fontStyle:"italic", marginTop:4, paddingTop:6, borderTop:"1px dashed #E5E7EB"}}>{m.notes}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ─── PIPELINE VIEW ─── */}
      {v==="pipeline" && (
        <div>
          {/* Pipeline legend */}
          <div style={{background:"#F9FAFB", border:"1px solid #E5E7EB", borderRadius:10, padding:"10px 14px", marginBottom:14, display:"flex", flexWrap:"wrap", gap:8, alignItems:"center"}}>
            <span style={{fontSize:10.5, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:1, marginRight:6}}>Pipeline categories</span>
            {[
              "Multilateral marketplace","National TTO","University TTO","DFI-linked platform","Sectoral accelerator","Patent pool — open to members","Standards body"
            ].map(k=>(
              <span key={k} style={{fontSize:10, color:"#fff", background:pipeColour(k), padding:"2px 8px", borderRadius:99, fontWeight:600}}>{k}</span>
            ))}
          </div>

          {/* Pipeline cards */}
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(380px,1fr))", gap:12}}>
            {IPC.pipeline.map((p,i)=>(
              <div key={i} className="ph-card" style={{background:"#fff", border:"1px solid #E5E7EB", borderRadius:10, padding:"14px 16px", display:"flex", flexDirection:"column", gap:6, borderLeft:"4px solid "+pipeColour(p.kind)}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, flexWrap:"wrap"}}>
                  <span style={{fontSize:10.5, fontWeight:700, color:"#fff", background:pipeColour(p.kind), padding:"2px 8px", borderRadius:99}}>{p.kind}</span>
                  <span style={{fontSize:10, fontWeight:600, color:"#6B7280", letterSpacing:0.5, textTransform:"uppercase"}}>Maturity: {p.maturity}</span>
                </div>
                <div style={{fontSize:14, fontWeight:700, color:"#111827", lineHeight:1.4, marginTop:4}}>{p.anchor}</div>
                <div style={{fontSize:12, color:"#374151", lineHeight:1.55}}><span style={{fontWeight:600, color:"#6B7280"}}>Scope:</span> {p.scope}</div>
                <div style={{fontSize:12, color:"#374151", lineHeight:1.55}}><span style={{fontWeight:600, color:"#6B7280"}}>{country==="br"?"Brazilian":"South African"} entries:</span> {p.entries}</div>
                <div style={{fontSize:11.5, color:"#4B5563", lineHeight:1.55}}><span style={{fontWeight:600}}>Relevance:</span> {p.relevance}</div>
                <div style={{fontSize:11.5, color:"#4B5563", lineHeight:1.6, fontStyle:"italic", marginTop:4, paddingTop:6, borderTop:"1px dashed #E5E7EB"}}>{p.notes}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Footer note */}
      <div style={{marginTop:18, padding:"14px 16px", background:"#FFF7ED", border:"1px solid #FED7AA", borderRadius:10}}>
        <div style={{fontSize:11.5, fontWeight:700, color:"#9A3412", textTransform:"uppercase", letterSpacing:1, marginBottom:4}}>Methodological note</div>
        <div style={{fontSize:12.5, color:"#7C2D12", lineHeight:1.6}}>
          Modality and Pipeline data are drawn from public corporate disclosures, regulatory registers (REIDI, MOVER, REIPPPP, JETP working-group records), multilateral platforms (WIPO GREEN, UNFCCC CTCN), and institutional reporting from <T c="DFI"/>s and tech-transfer offices. Where licensing terms are confidential — which is the majority case — the entry is flagged 'undisclosed' or 'indirect'. The absence of disclosure is, in this layer, treated as analytical content in its own right.
        </div>
      </div>

    </div>
  );
};


// ─── MAIN DASHBOARD ───
function Dashboard() {
  const [country, setCountry] = useState("sa");
  const [tab, setTab] = useState("overview");
  // v5 cross-navigation state ---------------------------
  const [valueChainsSectorId, setValueChainsSectorId] = useState(null); // optional override
  const [ipcommFilter, setIpcommFilter] = useState(null); // {sectorId, sectorName, techName} | null
  const [ipcommView, setIpcommView] = useState("modality"); // shared between programmatic + user toggles
  // Reset sector override + filter when country changes (sector ids differ across BR/SA)
  React.useEffect(()=>{ setValueChainsSectorId(null); setIpcommFilter(null); }, [country]);
  // -----------------------------------------------------
  const T_ = COUNTRY_THEMES[country];
  const tabs = [
    {k:"overview", label:"Overview"},
    {k:"chains", label:"Value Chains"},
    {k:"policies", label:"Policies"},
    {k:"targets", label:"Targets"},
    {k:"finance", label:"Financing"},
    {k:"ipcomm", label:"IP Commercialisation"},
    {k:"refs", label:"References & Abbrevs"},
  ];
  return (
    <div style={{minHeight:"100vh", background:"#F9FAFB"}}>
      <div style={{background:T_.header, color:"#fff", padding:"18px 24px", boxShadow:"0 4px 12px rgba(0,0,0,0.15)"}}>
        <div style={{maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
          <div>
            <h1 style={{fontSize:20, fontWeight:700, margin:0}}>Consolidated Dashboard South Africa — Green Industrialisation & <T c="IP"/> Landscape v5.0</h1>
            <p style={{fontSize:12, color:T_.accent, margin:"2px 0 0 0", letterSpacing:0.5}}>South Africa | <T c="IPR"/> & Green Industrialisation Programme | April 2026 | Equal International | Paulo Esteves</p>
          </div>
        </div>
      </div>

      <div style={{background:"#F0FDF4", borderBottom:"1px solid #A7F3D0", padding:"10px 24px"}}>
        <div style={{maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", gap:12, flexWrap:"wrap"}}>
          <span style={{fontSize:11, fontWeight:700, color:"#064E3B", textTransform:"uppercase", letterSpacing:1}}>Case</span>
          <span className="country-pill" style={{background: T_.header, color:"#fff", borderColor: T_.header}}>{T_.flag} {T_.name}</span>
        </div>
      </div>

      <div style={{background:"#fff", borderBottom:"2px solid #E5E7EB"}}>
        <div style={{maxWidth:1200, margin:"0 auto", display:"flex", gap:2, overflowX:"auto"}}>
          {tabs.map(t=>(
            <button key={t.k} className="tab-btn" onClick={()=>setTab(t.k)} style={{background:tab===t.k?T_.header:"transparent", color:tab===t.k?"#fff":"#4B5563", borderBottom:tab===t.k?"3px solid "+T_.header:"3px solid transparent"}}>{t.label}</button>
          ))}
        </div>
      </div>

      {tab==="overview" && <OpeningPage country={country} setTab={setTab} setCountry={setCountry}/>}
      {tab==="chains" && <ValueChainsTab country={country} sectorIdOverride={valueChainsSectorId} setSectorIdOverride={setValueChainsSectorId} setTab={setTab} setIpcommFilter={setIpcommFilter} setIpcommView={setIpcommView}/>}
      {tab==="policies" && <PoliciesTab country={country}/>}
      {tab==="targets" && <TargetsTab country={country}/>}
      {tab==="finance" && <FinancingTab country={country}/>}
      {tab==="ipcomm" && <IPCommercialisationTab country={country} filter={ipcommFilter} setFilter={setIpcommFilter} view={ipcommView} setView={setIpcommView} setTab={setTab} setSectorIdOverride={setValueChainsSectorId}/>}
      {tab==="refs" && <RefsTab country={country}/>}

      <div style={{borderTop:"1px solid #E5E7EB", background:"#1F2937", color:"#9CA3AF", padding:"20px 24px", marginTop:24}}>
        <div style={{maxWidth:1200, margin:"0 auto", display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:12}}>
          <div style={{fontSize:12}}>
            <span style={{color:"#D1D5DB", fontWeight:600}}>Equal International | <T c="IPR"/> & Green Industrialisation Programme</span>
            <span style={{margin:"0 8px", color:"#4B5563"}}>|</span>
            <span>April 2026</span>
          </div>
          <div style={{fontSize:12, color:"#D1D5DB", textAlign:"right"}}>
            <div style={{fontWeight:600}}>Author: Paulo Esteves</div>
            <div style={{fontSize:10, opacity:0.7, marginTop:2}}>Consolidated Dashboard South Africa — Green Industrialisation v5.0 | Single-country build derived from the consolidated v5 (May 2026)</div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<Dashboard/>, document.getElementById("root"));

</script>
</body>
</html>
